# How harness-guard runs Claude Desktop. Installed to /etc/harness-guard/agents/.
profile = "claude-desktop-guard"
exec = "/usr/lib/claude-desktop/claude-desktop.real"
args = ["--ozone-platform=wayland", "--disable-dev-shm-usage", "--password-store=kwallet6"]
cache = "~/.cache/claude-guard"
tmp = "/tmp/claude-1000"
keep_env = ["WAYLAND_DISPLAY", "XDG_ACTIVATION_TOKEN", "DESKTOP_STARTUP_ID"]

[env]
XDG_SESSION_TYPE = "wayland"
XDG_CURRENT_DESKTOP = "KDE"
KDE_SESSION_VERSION = "6"
# Window buttons come from compiled defaults, not the user's dconf.
GSETTINGS_BACKEND = "memory"
GSETTINGS_SCHEMA_DIR = "/etc/harness-guard/gtk-schemas"
GTK_USE_PORTAL = "1"
PULSE_SERVER = "unix:/run/user/1000/pulse/native"
PULSE_COOKIE = "~/.cache/claude-guard/pulse-cookie"
