# How harness-guard runs the Antigravity CLI. Installed to /etc/harness-guard/agents/ by the package.
# Paths may start with ~/ for the owner's home (/etc/harness-guard/owner.toml).
name = "Antigravity CLI (agy)"
# The root-owned forwarder that runs the launcher; the console checks it.
entry = "~/.local/bin/agy"
# The console shows the first version number this prints (run as qiu).
version = ["~/.local/bin/agy", "--version"]
profile = "agy-guard"
# The console starts it in a terminal, in a folder you pick.
terminal = true
exec = "~/.local/bin/agy"  # inside the private view below
argv0 = "agy"
cache = "~/.cache/agy-guard"
tmp = "/tmp/agy-1000"

# `agy update` rewrites ~/.local/bin/agy; it sees a private writable copy while the
# host file stays a root-owned forwarder.
binds = [["~/.local/state/agy/guard-bin", "~/.local/bin"]]

# Claude's guards can't switch into agy-guard, so `agy` there asks harness-guard-handoff
# to start it here (agy as a subagent). agy keeps its own guard and login.
handoff_from = ["claude-code-guard", "claude-desktop-guard"]

[env]
# agy keeps its login in the Secret Service, which holds every app's secrets and can't
# be limited to one entry. In an SSH session it uses its own file instead
# (~/.gemini/antigravity-cli/antigravity-oauth-token), so the guard looks like one.
SSH_CONNECTION = "127.0.0.1 1 127.0.0.1 22"
